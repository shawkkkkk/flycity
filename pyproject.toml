[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flycity"
version = "0.1.0"
description = "A persistent 3D world inhabited by autonomous digital fruit flies."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "openai>=1.60,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["flycity*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
